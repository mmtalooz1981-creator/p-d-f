name: Build, Verify & Publish Android APK

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      build_release:
        description: "Also build release APK (uses signing secrets if configured)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-and-publish-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Verify Debug APK with Android SDK tools (aapt2 & apksigner)
        run: |
          BUILD_TOOLS_DIR="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK_PATH"
          "$BUILD_TOOLS_DIR/aapt2" dump badging "$APK_PATH" | head -n 20
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose --print-certs "$APK_PATH"

      - name: Stage verified Debug APK into apk-distribution
        run: |
          mkdir -p apk-distribution
          cp app/build/outputs/apk/debug/app-debug.apk apk-distribution/MuedPdfPro-debug.apk
          (cd apk-distribution && sha256sum MuedPdfPro-debug.apk > MuedPdfPro-debug.apk.sha256)

      - name: Decode Release Keystore (if secrets provided)
        if: ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.build_release) && secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "${{ runner.temp }}/release.keystore"

      - name: Build & Verify Release APK (on tags or manual trigger)
        if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.build_release }}
        env:
          ANDROID_KEYSTORE_PATH: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && format('{0}/release.keystore', runner.temp) || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle assembleRelease --stacktrace
          BUILD_TOOLS_DIR="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          RELEASE_APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$RELEASE_APK"
          "$BUILD_TOOLS_DIR/aapt2" dump badging "$RELEASE_APK" | head -n 20
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose --print-certs "$RELEASE_APK"
          cp "$RELEASE_APK" apk-distribution/MuedPdfPro-release.apk
          (cd apk-distribution && sha256sum MuedPdfPro-release.apk > MuedPdfPro-release.apk.sha256)

      - name: Upload APK Distribution Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apk-distribution
          path: |
            apk-distribution/*.apk
            apk-distribution/*.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            apk-distribution/*.apk
            apk-distribution/*.sha256
